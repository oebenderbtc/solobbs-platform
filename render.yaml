services:
  - type: web
    name: solobbs
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm ci && npx prisma generate && npx prisma db push && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "22.12.0"
      # PostgreSQL en tu VPS Hostinger (no uses la DB free de Render)
      - key: DATABASE_URL
        sync: false
      - key: AUTH_SECRET
        generateValue: true
      - key: AUTH_URL
        sync: false
      - key: NEXTAUTH_URL
        sync: false
      - key: AUTH_TRUST_HOST
        value: "true"
      # Solo true en el primer deploy para cargar demos; luego false
      - key: SEED_ON_BOOT
        value: "false"
      - key: TRON_ESCROW_DEMO
        value: "false"
      - key: NEXT_PUBLIC_COP_PER_USDT
        value: "4100"
