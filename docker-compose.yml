services:
  postgres:
    image: postgres:16-alpine
    container_name: solobbs-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: solobbs
      POSTGRES_PASSWORD: solobbs
      POSTGRES_DB: solobbs
    volumes:
      - solobbs_pg:/var/lib/postgresql/data

volumes:
  solobbs_pg:
